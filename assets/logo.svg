<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Warm Gold Gradient -->
    <linearGradient id="champagneGold" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#faedd2" />
      <stop offset="35%" stop-color="#dfc18b" />
      <stop offset="70%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#9d7a36" />
    </linearGradient>

    <!-- Deep Emerald Crest Gradient -->
    <linearGradient id="emeraldShield" x1="60" y1="0" x2="60" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>

  <!-- Background Shield (Rounded Octagonal Academic Seal) -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#emeraldShield)" stroke="url(#champagneGold)" stroke-width="2" />
  <rect x="8" y="8" width="104" height="104" rx="24" fill="none" stroke="url(#champagneGold)" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="2 3" />

  <!-- Radiating Subtle Rays -->
  <g stroke="url(#champagneGold)" stroke-width="1.25" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="20" x2="60" y2="15" />
    <line x1="74" y1="24" x2="78" y2="19" />
    <line x1="46" y1="24" x2="42" y2="19" />
    <line x1="85" y1="35" x2="90" y2="32" />
    <line x1="35" y1="35" x2="30" y2="32" />
  </g>

  <!-- Elegant Crescent Moon (Hilāl) -->
  <path d="M60 26C51.163 26 44 33.163 44 42C44 50.837 51.163 58 60 58C62.775 58 65.385 57.292 67.653 56.05C61.854 54.832 57.5 49.697 57.5 43.5C57.5 37.303 61.854 32.168 67.653 30.95C65.385 29.708 62.775 26 60 26Z" fill="url(#champagneGold)" />

  <!-- Guiding Morning Star -->
  <path d="M68 34L69.2 37.8L73 39L69.2 40.2L68 44L66.8 40.2L63 39L66.8 37.8L68 34Z" fill="#faedd2" />

  <!-- Open Sacred Quran Book (Manuscript Curves) -->
  <g id="open-quran">
    <!-- Left Page -->
    <path d="M60 76C48 71 34 72 26 76C24.5 76.7 24 78 24 79.5L25 93C33 89 47 88 59 93C59.6 93.3 60 93.3 60 93.3V76Z" fill="url(#champagneGold)" fill-opacity="0.95" />
    <path d="M28 79C35 76 46 75.5 56 79.5" stroke="#022c22" stroke-width="1" stroke-linecap="round" />
    <path d="M30 83C36 80.5 46 80 54 83.5" stroke="#022c22" stroke-width="0.8" stroke-linecap="round" opacity="0.75" />

    <!-- Right Page -->
    <path d="M60 76C72 71 86 72 94 76C95.5 76.7 96 78 96 79.5L95 93C87 89 73 88 61 93C60.4 93.3 60 93.3 60 93.3V76Z" fill="url(#champagneGold)" />
    <path d="M92 79C85 76 74 75.5 64 79.5" stroke="#022c22" stroke-width="1" stroke-linecap="round" />
    <path d="M90 83C84 80.5 74 80 66 83.5" stroke="#022c22" stroke-width="0.8" stroke-linecap="round" opacity="0.75" />

    <!-- Spine Ribbon / Bookmark (Emerald Accent) -->
    <path d="M60 76V97L57.5 94.5L55 97V77" fill="#34d399" />
  </g>

  <!-- Carved Stand Base -->
  <path d="M42 94L36 102H43L47 96" stroke="url(#champagneGold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M78 94L84 102H77L73 96" stroke="url(#champagneGold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="60" cy="98" r="1.5" fill="#dfc18b" />
</svg>
